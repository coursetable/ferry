name: Academic Calendar Archive

on:
  workflow_dispatch:
    inputs:
      sync_db:
        description: "Sync to database? This replaces the academic calendar table."
        type: boolean
        required: true
        default: false

jobs:
  academic_calendar_archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: coursetable/ferry-data
          path: data
          ssh-key: ${{ secrets.REPO_SSH_KEY }}
          fetch-depth: 1

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get -y install gcc g++ musl-dev libffi-dev libpq-dev libhdf5-dev python3-tables graphviz libgraphviz-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv .venv
          echo "VIRTUAL_ENV=.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          uv pip install -e .

      - name: Fetch Archived Academic Calendars
        run: |
          python -u main.py --crawl-academic-calendar-archive

      - name: Commit Academic Calendar Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: add archived academic calendars"
          commit_user_name: "Ferry Bot"
          commit_user_email: "coursetable.at.yale@gmail.com"
          commit_author: course-table <course-table@users.noreply.github.com>
          repository: data
          file_pattern: "academic_calendar/*.json"
          skip_dirty_check: false

      - name: Sync to Database
        if: ${{ inputs.sync_db }}
        env:
          DATABASE_CONNECT_STRING: ${{ secrets.DATABASE_CONNECT_STRING }}
        run: |
          python -u main.py --sync-db-academic-calendar --database-connect-string "$DATABASE_CONNECT_STRING"
